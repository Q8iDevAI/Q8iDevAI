npmRebuild: false
appId: sh.q8idevai.desktop
productName: Q8iDevAI
executableName: Q8iDevAI
protocols:
  - name: Q8iDevAI agent link
    schemes:
      - q8idevai
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@q8idevai/*/src/**"
  - "!node_modules/@q8idevai/**/*.test.*"
  - "!node_modules/@q8idevai/**/*.spec.*"
  - "!node_modules/@q8idevai/server/dist/server/web-ui/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@q8idevai/*/.debug/**"
  - "!node_modules/@q8idevai/*/.tasks/**"
  - "!node_modules/@q8idevai/*/conversations/**"
  - "!node_modules/@q8idevai/*/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@q8idevai/server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
publish:
  provider: github
  owner: getq8idevai
  repo: q8idevai
mac:
  artifactName: "Q8iDevAI-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/q8idevai
      to: bin/q8idevai
    - from: assets/icon.png
      to: icon.png
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "Q8iDevAI-${version}-${arch}.${ext}"
  maintainer: "MOHAMMAD MOFTAH <Admin@Q8iDev.CoM>"
  vendor: "Q8iDevAI"
  extraResources:
    - from: bin/q8idevai
      to: bin/q8idevai
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  afterInstall: scripts/linux-sandbox/after-install.tpl
rpm:
  afterInstall: scripts/linux-sandbox/after-install.tpl
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ["--class=Q8iDevAI"]
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/q8idevai CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "Q8iDevAI-${arch}.${ext}"
win:
  artifactName: "Q8iDevAI-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: bin/q8idevai.cmd
      to: bin/q8idevai.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
