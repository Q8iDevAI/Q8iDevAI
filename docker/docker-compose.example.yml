# Minimal Q8iDevAI daemon + web UI deployment.
#
# Open http://localhost:6767 after `docker compose up -d`.
# For any network-reachable deployment, change Q8IDEVAI_PASSWORD first.
services:
  q8idevai:
    image: ghcr.io/getq8idevai/q8idevai:latest
    container_name: q8idevai
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      Q8IDEVAI_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # Q8IDEVAI_HOSTNAMES: "q8idevai.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./q8idevai-home:/home/q8idevai
      # Code visible to Q8iDevAI and the agents it launches.
      - ./workspace:/workspace
